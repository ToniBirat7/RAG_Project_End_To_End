version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: rag_postgres
    env_file: ./postgres.env
    environment:
      # Additional safe defaults; sensitive values should live in postgres.env
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro  # run init SQL on first startup
    ports:
      - "5432:5432"
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:7
    container_name: rag_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - rag-network
    restart: unless-stopped
    depends_on:
      - postgres

volumes:
  pgdata:
  pgadmin_data:

networks:
  rag-network:
    driver: bridge
